name: settlo_core
description: Theme, router, money and Supabase client shared by every feature.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Figtree and IBM Plex Serif, bundled so text never depends on the network
  # (ADR 0006). Use them through SettloTypography, which sets
  # `package: 'settlo_core'`.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
    - family: IBM Plex Serif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Medium.ttf
          weight: 500
  # Licence texts for the fonts above.
  assets:
    - assets/fonts/Figtree-OFL.txt
    - assets/fonts/IBMPlexSerif-OFL.txt
