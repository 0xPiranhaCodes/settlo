name: settlo_core
description: Theme, router, money and Supabase client shared by every feature.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: ^0.20.2
  pdf: ^3.13.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  settlo_test_support:
    path: ../test_support

flutter:
  # Figtree, bundled so text never depends on the network. Use it through
  # SettloTypography, which sets
  # `package: 'settlo_core'`.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
  # Licence texts for the fonts above.
  assets:
    - assets/brand/sabkijeb_mark.png
    - assets/fonts/Figtree-OFL.txt
