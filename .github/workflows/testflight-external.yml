name: TestFlight external

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Existing iOS TestFlight build number (for rc6, use 6)
        required: true
        type: string
      group:
        description: Existing external TestFlight group
        required: true
        default: Family Testers
        type: string
      what_to_test:
        description: Public What to Test text (no credentials)
        required: true
        type: string

permissions:
  contents: read

# App-wide metadata is shared across builds and groups. Never cancel a partial update.
concurrency:
  group: testflight-external
  cancel-in-progress: false

jobs:
  distribute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare external testing and submit for beta review
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          HOSTED_TEST_OTP: ${{ secrets.HOSTED_TEST_OTP }}
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BETA_GROUP: ${{ inputs.group }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: ruby scripts/asc-testflight-external.rb
