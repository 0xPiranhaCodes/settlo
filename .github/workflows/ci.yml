name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Regenerate app and core goldens instead of running CI
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze & test
    if: inputs.update_goldens != true
    # Pin golden rasterization to one runner image; update intentionally.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze workspace
        run: flutter analyze

      - name: Test workspace members with coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          : > coverage/lcov.info

          members=()
          while IFS= read -r member; do
            members+=("$member")
          done < <(
            dart pub workspace list --json | python3 -c '
          import json
          import os
          import sys

          for package in json.load(sys.stdin)["packages"]:
              path = package["path"]
              if os.path.isdir(os.path.join(path, "test")):
                  print(path)
          '
          )

          if (( ${#members[@]} == 0 )); then
            echo "No workspace members with a test/ directory were found." >&2
            exit 1
          fi

          coverage_files=()
          for member in "${members[@]}"; do
            relative_member="${member#"$GITHUB_WORKSPACE"/}"
            echo "Testing $relative_member"
            (
              cd "$member"
              flutter test --coverage
            )
            coverage_files+=("$member/coverage/lcov.info")
          done

          python3 - "$GITHUB_WORKSPACE" "${coverage_files[@]}" <<'PY'
          import collections
          import os
          import sys

          root = sys.argv[1]
          merged = collections.defaultdict(lambda: collections.defaultdict(int))

          for trace_path in sys.argv[2:]:
              member = os.path.dirname(os.path.dirname(trace_path))
              source = None
              with open(trace_path, encoding="utf-8") as trace:
                  for raw_line in trace:
                      line = raw_line.rstrip("\n")
                      if line.startswith("SF:"):
                          source_path = line[3:]
                          if not os.path.isabs(source_path):
                              source_path = os.path.join(member, source_path)
                          source = os.path.relpath(source_path, root)
                      elif line.startswith("DA:") and source is not None:
                          line_number, hits = line[3:].split(",", 1)
                          merged[source][int(line_number)] += int(hits)

          with open(os.path.join(root, "coverage", "lcov.info"), "w", encoding="utf-8") as output:
              for source, lines in sorted(merged.items()):
                  output.write(f"SF:{source}\n")
                  for line_number, hits in sorted(lines.items()):
                      output.write(f"DA:{line_number},{hits}\n")
                  output.write(f"LF:{len(lines)}\n")
                  output.write(f"LH:{sum(hits > 0 for hits in lines.values())}\n")
                  output.write("end_of_record\n")
          PY

      - name: Enforce coverage requirements
        shell: bash
        run: |
          set -euo pipefail
          baseline_file=.github/coverage-baseline.txt

          if [[ "${{ github.event_name }}" == "pull_request" ]] && \
             git cat-file -e "origin/${{ github.base_ref }}:$baseline_file" 2>/dev/null; then
            baseline="$(git show "origin/${{ github.base_ref }}:$baseline_file")"
          else
            baseline="$(<"$baseline_file")"
          fi

          read -r lines_found lines_hit < <(
            awk -F: '
              /^LF:/ { found += $2 }
              /^LH:/ { hit += $2 }
              END { print found + 0, hit + 0 }
            ' coverage/lcov.info
          )

          if (( lines_found == 0 )); then
            echo "Merged coverage contains no instrumented lines." >&2
            exit 1
          fi

          coverage="$(awk -v hit="$lines_hit" -v found="$lines_found" \
            'BEGIN { printf "%.2f", (hit * 100) / found }')"
          echo "Total line coverage: $coverage% ($lines_hit/$lines_found)"
          echo "Main baseline: $baseline%"

          if awk -v coverage="$coverage" -v baseline="$baseline" \
            'BEGIN { exit !(coverage + 0 < baseline + 0) }'; then
              echo "Coverage dropped below the main baseline." >&2
              exit 1
          fi

          read -r money_lines_found money_lines_hit < <(
            awk -F: '
              /^SF:/ { money = ($2 ~ /^packages\/core\/lib\/money\//) }
              money && /^LF:/ { found += $2 }
              money && /^LH:/ { hit += $2 }
              END { print found + 0, hit + 0 }
            ' coverage/lcov.info
          )

          if (( money_lines_found == 0 )); then
            echo "Merged coverage contains no packages/core/lib/money lines." >&2
            exit 1
          fi

          money_coverage="$(awk -v hit="$money_lines_hit" -v found="$money_lines_found" \
            'BEGIN { printf "%.2f", (hit * 100) / found }')"
          echo "Money line coverage: $money_coverage% ($money_lines_hit/$money_lines_found)"

          if awk -v hit="$money_lines_hit" -v found="$money_lines_found" \
            'BEGIN { exit !((hit * 100) < (found * 80)) }'; then
              echo "packages/core/lib/money line coverage is below 80%." >&2
              exit 1
          fi

  android:
    name: Android debug build
    if: inputs.update_goldens != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

  ios-paths:
    name: Determine iOS build requirement
    if: inputs.update_goldens != true
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.ios-changes.outputs.should_build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine whether iOS build is required
        id: ios-changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          should_build=false

          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            should_build=true
          elif [[ "$EVENT_NAME" == "pull_request" ]] && \
               ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
                 app/ios app/pubspec.yaml pubspec.lock packages/platform; then
            should_build=true
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS debug build
    needs: ios-paths
    if: needs.ios-paths.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Build debug iOS app
        working-directory: app
        run: flutter build ios --no-codesign --debug

  supabase:
    name: Supabase
    if: inputs.update_goldens != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Start local Supabase
        run: scripts/supabase-local.sh start

      - name: Reset local database
        run: scripts/supabase-local.sh db reset

      - name: Run database tests
        run: scripts/supabase-local.sh test db

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: Test edge functions
        working-directory: supabase/functions
        run: deno test

  regenerate-goldens:
    name: Regenerate app and core goldens
    if: inputs.update_goldens == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate app and core goldens
        shell: bash
        run: |
          set -euo pipefail
          (
            cd app
            flutter test --update-goldens
          )
          (
            cd packages/core
            flutter test --update-goldens
          )

      - name: Commit app and core goldens
        shell: bash
        run: |
          set -euo pipefail
          git add app/test/goldens/*.png
          git add packages/core/test/theme/goldens/*.png
          git add packages/core/test/widgets/goldens/*.png
          if git diff --cached --quiet; then
            echo "App and core goldens are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: regenerate goldens on ubuntu-24.04"
          git push origin "HEAD:${GITHUB_REF_NAME}"
