name: Supabase hosted

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the hosted project
        required: true
        type: choice
        default: db-push
        options:
          - db-push
          - set-test-otp
          - clear-test-otp
          - deploy-send-sms
          - set-sms-secrets
          - enable-sms-hook
          - disable-sms-hook
      apply:
        description: "db-push only: apply the migrations after the dry run"
        required: false
        type: boolean
        default: false

concurrency:
  group: supabase-hosted
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

# Trust boundary (docs/decisions/2026-11-10-release-trust-boundary.md): every job runs in the
# `production` environment and refuse any ref but main. SUPABASE_ACCESS_TOKEN is a repository
# secret, handed only to the steps that call Supabase.
jobs:
  db-push:
    name: Migrations
    if: inputs.action == 'db-push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The hosted project takes migrations from main only."
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      # The raw CLI on purpose: scripts/supabase-local.sh refuses remote commands.
      - name: Link hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --remote

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --remote --dry-run

      - name: Apply migrations
        if: inputs.apply && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --remote --yes

  test-otp:
    name: Test OTP numbers
    if: endsWith(inputs.action, '-test-otp')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Hosted Auth config is changed from main only."
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Patch hosted Auth config
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # "<number>=<code>,<number>=<code>", country code without +. Never committed or echoed.
          HOSTED_TEST_OTP: ${{ secrets.HOSTED_TEST_OTP }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == set-test-otp ]]; then
            [[ -n "$HOSTED_TEST_OTP" ]] || { echo "::error::Secret HOSTED_TEST_OTP is not set."; exit 1; }
            # The numbers lapse on their own after 60 days; re-run to extend. Placeholder Twilio
            # values only switch phone login on: test numbers never reach a provider.
            body="$(jq -n --arg until "$(date -u -d '+60 days' +%Y-%m-%dT%H:%M:%SZ)" '{
              external_phone_enabled: true,
              sms_provider: "twilio",
              sms_twilio_account_sid: "placeholder",
              sms_twilio_auth_token: "placeholder",
              sms_twilio_message_service_sid: "placeholder",
              sms_test_otp: env.HOSTED_TEST_OTP,
              sms_test_otp_valid_until: $until
            }')"
          else
            body='{"sms_test_otp": ""}'
          fi

          # The response repeats the Auth config and an error may echo the submitted list, so the
          # body is discarded: this public log gets the status and a fixed message only.
          # The token (as a curl config on a pipe) and the body (on stdin) stay out of curl's argv.
          status="$(printf '%s' "$body" | curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            --config <(printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_ACCESS_TOKEN") \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H 'Content-Type: application/json' \
            --data-binary @-)"
          echo "Management API answered $status"
          if [[ "$status" != 2* ]]; then
            echo "::error::The Auth config was not changed. Check the token's access and the format of HOSTED_TEST_OTP."
            exit 1
          fi
          echo "Hosted Auth config updated ($ACTION)."

      # Once real SMS is live (repository variable SMS_LIVE=true), no test number may remain (#119).
      - name: Require no test numbers when SMS is live
        if: inputs.action == 'clear-test-otp' && vars.SMS_LIVE == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/supabase-hosted-sms.sh check-test-otp

  # Production SMS through the MSG91 Send-SMS hook (#119). Order: deploy-send-sms, set-sms-secrets,
  # enable-sms-hook; see supabase/README.md#enabling-on-the-hosted-project.
  sms-hook:
    name: Send-SMS hook
    if: contains(fromJSON('["deploy-send-sms", "set-sms-secrets", "enable-sms-hook", "disable-sms-hook"]'), inputs.action)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The hosted Send-SMS hook is changed from main only."
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        if: inputs.action == 'deploy-send-sms'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      # Reads verify_jwt = false from config.toml: GoTrue signs the hook call, it sends no user JWT.
      - name: Deploy send-sms
        if: inputs.action == 'deploy-send-sms'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-sms --project-ref "$SUPABASE_PROJECT_REF"

      # Generates a new hook secret each run and sets it on the function and the Auth hook; the
      # hook must be disabled first. Values are masked and never printed.
      - name: Set function secrets and hook config
        if: inputs.action == 'set-sms-secrets'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
          MSG91_SENDER_ID: ${{ secrets.MSG91_SENDER_ID }}
        run: scripts/supabase-hosted-sms.sh set-secrets

      - name: Enable the hook
        if: inputs.action == 'enable-sms-hook'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/supabase-hosted-sms.sh enable

      - name: Disable the hook
        if: inputs.action == 'disable-sms-hook'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/supabase-hosted-sms.sh disable
