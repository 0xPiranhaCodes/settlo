name: settlo
description: Settlo, a shared-finance tracker for India.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  app_links: ^7.2.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  settlo_activity:
    path: ../packages/features/activity
  settlo_auth:
    path: ../packages/features/auth
  settlo_balances:
    path: ../packages/features/balances
  settlo_core:
    path: ../packages/core
  settlo_expenses:
    path: ../packages/features/expenses
  settlo_loans:
    path: ../packages/features/loans
  settlo_local:
    path: ../packages/local
  settlo_platform:
    path: ../packages/platform
  settlo_profile:
    path: ../packages/features/profile
  settlo_settle:
    path: ../packages/features/settle
  settlo_spaces:
    path: ../packages/features/spaces
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  settlo_test_support:
    path: ../packages/test_support

flutter:
  uses-material-design: true
