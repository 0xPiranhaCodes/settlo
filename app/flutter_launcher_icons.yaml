# Owner artwork (#192). First: python3 scripts/derive-app-icon.py from repo root.
# Then, in app/: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/opaque.png
  android: true
  adaptive_icon_background: "#0A0B0D"
  adaptive_icon_foreground: assets/icon/adaptive-foreground.png
  # Foreground is already fitted inside the centered 66% safe circle.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 26
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0A0B0D"
